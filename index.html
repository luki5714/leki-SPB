<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schatzipubsibär 🐻</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff4f7;
    color: #49333b;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: 50px auto;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 5px 20px #0001;
}

h1 {
    color: #d76a91;
}

input, button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    box-sizing: border-box;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 16px;
}

button {
    background: #e88cac;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #d76a91;
}

.switch {
    background: none;
    color: #d76a91;
}

#message {
    margin-top: 15px;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🐻 Schatzipubsibär 🐻</h1>
<p>Ein kleiner gemütlicher Ort.</p>

<div id="auth">

<h2 id="formTitle">Anmelden</h2>

<input id="username" type="text" placeholder="Spitzname" maxlength="20">

<input id="password" type="password" placeholder="Passwort (mind. 8 Zeichen)" maxlength="72">

<button id="mainButton" onclick="handleAuth()">Anmelden</button>

<button class="switch" onclick="toggleMode()" id="switchButton">
Noch kein Konto? Registrieren
</button>

<p id="message"></p>

</div>

<div id="loggedIn" class="hidden">

<h2>Willkommen 🐻</h2>
<p id="welcome"></p>

<p>Du bist angemeldet!</p>

<button onclick="logout()">Abmelden</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xkkysjqiukvgkafzqqve.supabase.co";
const SUPABASE_KEY = "sb_publishable_oiu83sRLFllvZAUnh4CYsg_fMwWR77E";

const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const FUNCTION_URL =
    SUPABASE_URL + "/functions/v1/username-auth";

let isRegister = false;

function toggleMode() {
    isRegister = !isRegister;

    document.getElementById("formTitle").textContent =
        isRegister ? "Registrieren" : "Anmelden";

    document.getElementById("mainButton").textContent =
        isRegister ? "Konto erstellen" : "Anmelden";

    document.getElementById("switchButton").textContent =
        isRegister
        ? "Schon ein Konto? Anmelden"
        : "Noch kein Konto? Registrieren";

    document.getElementById("message").textContent = "";
}

async function handleAuth() {
    const username = document
        .getElementById("username")
        .value.trim();

    const password = document
        .getElementById("password")
        .value;

    const message = document.getElementById("message");
    const button = document.getElementById("mainButton");

    if (!username || !password) {
        message.textContent = "Bitte alles ausfüllen.";
        return;
    }

    if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        message.textContent =
            "Der Spitzname muss 3–20 Zeichen haben (Buchstaben, Zahlen, _).";
        return;
    }

    if (password.length < 8) {
        message.textContent =
            "Das Passwort muss mindestens 8 Zeichen haben.";
        return;
    }

    button.disabled = true;
    message.textContent = "Bitte warten...";

    try {
        const response = await fetch(FUNCTION_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({
                username: username,
                password: password,
                action: isRegister ? "register" : "login"
            })
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent =
                data.error || "Es ist ein Fehler aufgetreten.";
            return;
        }

        if (isRegister) {
            message.textContent =
                "Konto erstellt! Du kannst dich jetzt anmelden.";

            isRegister = false;
            toggleMode();

            document.getElementById("password").value = "";
        } else {
            const { error } = await sb.auth.setSession({
                access_token: data.access_token,
                refresh_token: data.refresh_token
            });

            if (error) {
                message.textContent =
                    "Anmeldung konnte nicht gespeichert werden.";
                return;
            }

            showLoggedIn(username);
        }

    } catch (error) {
        message.textContent =
            "Verbindung fehlgeschlagen. Bitte versuche es erneut.";
    } finally {
        button.disabled = false;
    }
}

function showLoggedIn(username) {
    document.getElementById("auth").classList.add("hidden");
    document.getElementById("loggedIn").classList.remove("hidden");

    document.getElementById("welcome").textContent =
        "Du bist als " + username + " angemeldet.";
}

async function logout() {
    await sb.auth.signOut();

    document.getElementById("loggedIn").classList.add("hidden");
    document.getElementById("auth").classList.remove("hidden");

    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("message").textContent = "";

    isRegister = false;

    document.getElementById("formTitle").textContent = "Anmelden";
    document.getElementById("mainButton").textContent = "Anmelden";
    document.getElementById("switchButton").textContent =
        "Noch kein Konto? Registrieren";
}

</script>

</body>
</html>
